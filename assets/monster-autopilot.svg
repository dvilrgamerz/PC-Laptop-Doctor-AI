<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" aria-labelledby="title desc">
  <title id="title">PC Monster Autopilot</title><desc id="desc">Original futuristic shield core linking gaming, storage and Windows startup automation.</desc>
