name: Windows installer and portable builds

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'electron/**'
      - 'src/**'
      - 'build/**'
      - 'index.html'
      - 'package.json'
      - '.github/workflows/windows-release.yml'
      - 'RELEASE_NOTES.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build dependencies
        run: npm install --no-audit --no-fund
      - name: Run regression tests
        run: npm test
      - name: Validate Electron sources
        run: |
          node --check electron/main.cjs
          node --check electron/security.cjs
          node --check electron/fixes.cjs && node --check electron/fixes.cjs
          node --check electron/preload.cjs
          node --check electron/local-llm.cjs
          node --check electron/hardware.cjs
          node --check electron/disk-check.cjs
          node --check electron/maintenance.cjs
      - name: Build Windows Setup and Portable EXEs
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:win
      - name: Validate EXE output and write SHA-256 checksums
        shell: pwsh
        run: |
          $files = @(Get-ChildItem 'release' -Filter '*.exe')
          if ($files.Count -ne 2) { throw "Expected 2 Windows EXEs, found $($files.Count)" }
          if (-not @($files | Where-Object Name -Match 'Setup').Count) { throw "Setup installer missing" }
          if (-not @($files | Where-Object Name -Match 'Portable').Count) { throw "Portable executable missing" }
          $hashes = $files | ForEach-Object { "$( (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() )  $($_.Name)" }
          $hashes | Set-Content 'release/SHA256SUMS.txt' -Encoding utf8
          Get-Content 'release/SHA256SUMS.txt'
      - name: Upload Windows builds
        uses: actions/upload-artifact@v4
        with:
          name: pc-laptop-doctor-ai-windows-${{ github.sha }}
          path: |
            release/*.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Publish versioned prerelease (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$(node -p "require('./package.json').version")"
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag exists. Bump version to publish a new release instead of replacing existing files."
            exit 0
          }
          $assets = @(Get-ChildItem 'release' -Filter '*.exe' | ForEach-Object { $_.FullName })
          $assets += (Resolve-Path 'release/SHA256SUMS.txt').Path
          gh release create $tag $assets --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "PC Laptop Doctor AI $tag" --prerelease --notes-file RELEASE_NOTES.md
